[package]
name = "romcruncher"
version = "0.1.0"
description = "Convert disc and disk images to CHD format for use with RomM and Hasheous"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "romcruncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
sevenz-rust = "0.6"
unrar = "0.4"
sha1 = "0.10"
crc32fast = "1"
hex = "0.4"
roxmltree = "0.19"

